name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  rust-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm --filter @orchestrator/desktop typecheck
      - run: pnpm --filter @orchestrator/desktop build

  windows-bundles:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install
      - run: cargo test --workspace
      - run: pnpm --filter @orchestrator/desktop typecheck
      - run: pnpm --filter @orchestrator/desktop build
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/security-audit.ps1
      - run: pnpm --filter @orchestrator/desktop exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: psylium-windows-bundles
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
