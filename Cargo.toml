[workspace]
resolver = "2"
members = [
  "crates/shared-protocol",
  "crates/process-manager",
  "crates/provider-adapters",
  "crates/orchestrator-core",
  "crates/workspace-manager",
  "crates/workflow-engine",
  "crates/remote-server",
  "crates/usage-monitor",
  "crates/workflow-runner",
  "crates/permission-engine",
  "crates/codex-app-server",
  "crates/claude-code-adapter",
  "crates/session-manager",
  "crates/antigravity-adapter",
  "crates/provider-runtime",
  "crates/agent-router",
  "crates/orchestrator-intelligence",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
